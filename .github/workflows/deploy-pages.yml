# GitHub Pages 배포: 기본 브랜치에 푸시하면 게임을 빌드해서 https://<계정>.github.io/<저장소>/ 로 올립니다.
# 저장소 Settings → Secrets and variables → Actions → Variables 에 SUPABASE_URL, SUPABASE_KEY 를 넣어 주세요.
name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 기본 브랜치(또는 수동 실행)에서만 배포
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      # 무중단 배포: 직전 배포들의 JS/CSS 파일을 보관해 두었다가 새 배포에도 함께 올림.
      # GitHub Pages 는 index.html 을 최대 10분 캐시하므로, 배포 직후에도 예전 index.html 이
      # 가리키는 예전 파일을 받을 수 있어야 플레이 중이던 학생 화면이 하얗게 되지 않음.
      - name: Restore previous assets
        uses: actions/cache/restore@v4
        with:
          path: .pages-prev-assets
          key: pages-assets-${{ github.run_id }}
          restore-keys: pages-assets-

      - name: Check Supabase settings
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_KEY 변수가 없어 랭킹 없이(오프라인 모드) 배포합니다."
          fi

      - name: Build
        working-directory: client
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
        run: npm run build

      - name: Keep previous assets (14일)
        run: |
          mkdir -p .pages-prev-assets
          find .pages-prev-assets -type f -mtime +14 -delete
          for f in .pages-prev-assets/*; do
            if [ -f "$f" ] && [ ! -e "client/dist/assets/$(basename "$f")" ]; then cp "$f" client/dist/assets/; fi
          done
          cp client/dist/assets/* .pages-prev-assets/
          ls client/dist/assets

      - name: Save assets for next deploy
        uses: actions/cache/save@v4
        with:
          path: .pages-prev-assets
          key: pages-assets-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
